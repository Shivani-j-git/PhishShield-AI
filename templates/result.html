<!DOCTYPE html>
<html>
<head>
    <title>PhishShield AI - Result</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>🛡 Scan Result</h1>

    <div class="card">

        <h3>Scanned URL</h3>
        <p>{{ url }}</p>

        {% if result == "Phishing" %}
            <h2 class="danger">⚠ PHISHING WEBSITE</h2>
        {% else %}
            <h2 class="safe">✅ SAFE WEBSITE</h2>
        {% endif %}

        <h3>AI Risk Score: {{ score }}%</h3>

        <br>

        <!-- PDF Download Button -->
        <a href="/{{ pdf }}" download>
            <button>📄 Download PDF Report</button>
        </a>

        <br><br>

        <a href="/">
            <button>⬅ Back to Dashboard</button>
        </a>

    </div>

</div>

</body>
</html>
