<!DOCTYPE html>
<html>
<head>
    <title>Analytics</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h1>📊 Security Analytics</h1>

<div class="card">

    <h2>Total Scans : {{ total }}</h2>

    <svg width="220" height="220" viewBox="0 0 42 42">

        <circle cx="21" cy="21" r="15.9"
            fill="transparent"
            stroke="#22c55e"
            stroke-width="5"
            stroke-dasharray="{{ safe*100/total if total else 0 }} 100"
            stroke-dashoffset="25"/>

        <circle cx="21" cy="21" r="15.9"
            fill="transparent"
            stroke="#ef4444"
            stroke-width="5"
            stroke-dasharray="{{ phishing*100/total if total else 0 }} 100"
            stroke-dashoffset="{{25 + (safe*100/total if total else 0)}}"/>

        <text x="21" y="22"
            text-anchor="middle"
            font-size="4"
            fill="white">
            {{total}}
        </text>

    </svg>

    <p>🟢 Safe : {{safe}}</p>
    <p>🔴 Phishing : {{phishing}}</p>

</div>

<a href="/">⬅ Dashboard</a>

</div>

</body>
</ht>
