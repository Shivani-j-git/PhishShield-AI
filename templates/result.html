<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h1>🛡 Scan Result</h1>

<div class="card">

<p><b>URL</b></p>
<p>{{url}}</p>

{% if result=="Phishing" %}
<h2 class="danger">⚠ Phishing Website</h2>
{% else %}
<h2 class="safe">✅ Safe Website</h2>
{% endif %}

<h3>AI Risk Score : {{score}}%</h3>

<a href="/">Scan Another</a>

</div>

</div>

</body>
</html>
